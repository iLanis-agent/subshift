<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SubShift - fix out-of-sync subtitles</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--dim:#8b949e;--acc:#58a6ff;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
.top{display:flex;align-items:baseline;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.top b{font-size:19px}.top b span{color:var(--acc)}
.top small{color:var(--dim)}
.wrap{max-width:960px;margin:0 auto;padding:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
button{background:#21262d;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
button:hover{background:#2d333b}
button.primary{background:var(--acc);color:#0b1c2e;font-weight:600;border-color:var(--acc)}
button.on{border-color:var(--acc);color:var(--acc)}
input[type=text],input[type=number]{background:#0d1117;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 10px;font-size:14px;width:130px}
textarea{width:100%;min-height:180px;background:#0d1117;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:12px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.stat{color:var(--dim);font-size:13px}
.stat b{color:var(--fg)}
.warn{background:#2d2306;border:1px solid #9e6a03;color:#e3b341;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.warn ul{margin:6px 0 0;padding-left:18px}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
th{color:var(--dim);text-align:left;font-weight:600;padding:4px 8px;border-bottom:1px solid var(--line)}
td{padding:4px 8px;border-bottom:1px solid #21262d;vertical-align:top}
td.t{white-space:pre-wrap;font-family:inherit}
.chg{color:var(--ok)}
label.opt{font-size:13.5px;color:var(--dim);display:flex;gap:6px;align-items:center}
h3{margin:0 0 8px;font-size:14px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
footer{color:var(--dim);font-size:13px;text-align:center;padding:18px}
footer a{color:var(--acc);text-decoration:none}
</style>
</head>
<body>
<div class="top"><b>Sub<span>Shift</span></b><small>shift, stretch and convert subtitles - everything stays on your machine</small></div>
<div class="wrap">
  <div class="card">
    <div class="row">
      <button class="primary" id="open">Open .srt / .vtt</button>
      <input type="file" id="file" accept=".srt,.vtt,text/plain" style="display:none">
      <span class="stat">or paste below, or try a preset:</span>
      <button class="preset" data-p="plain">plain srt</button>
      <button class="preset" data-p="movie">movie vtt</button>
      <button class="preset" data-p="messy">messy file</button>
    </div>
    <textarea id="src" spellcheck="false" placeholder="Paste SRT or WebVTT here..."></textarea>
  </div>
  <div id="warnbox"></div>
  <div class="card" id="ops" style="display:none">
    <div class="row">
      <label class="opt">shift by <input type="number" id="shiftms" value="2500" step="100"> ms</label>
      <button id="doshift">apply shift</button>
      <label class="opt">stretch <input type="text" id="ratio" value="1.042709" style="width:90px"></label>
      <button id="dostretch">apply stretch</button>
      <span class="stat">(25 fps to 23.976 = 1.042709, 23.976 to 25 = 0.95904)</span>
    </div>
    <div class="row">
      <span class="stat">download as:</span>
      <button id="dlsrt">.srt</button>
      <button id="dlvtt">.vtt</button>
      <span class="stat" id="meta"></span>
    </div>
  </div>
  <div class="card" id="preview" style="display:none">
    <h3>cues</h3>
    <table><thead><tr><th>#</th><th>start</th><th>end</th><th>text</th></tr></thead><tbody id="rows"></tbody></table>
  </div>
</div>
<footer>Cross-checked against an independent Python parser (64 checks). <a href="index.html">about</a></footer>
<script src="engine.js"></script>
<script>
const $=id=>document.getElementById(id);
let parsed=null,fileName='subtitles';
const PRESETS={
plain:`1\n00:00:01,000 --> 00:00:03,500\nHello there.\n\n2\n00:00:04,000 --> 00:00:06,250\nSecond line\nwith two rows.\n\n3\n00:01:00,000 --> 01:02:03,999\nOne hour in.\n`,
movie:`WEBVTT - a film\n\nNOTE this is a comment\nspanning two lines\n\ncue-1\n00:00:10.000 --> 00:00:12.000 align:start position:10%\nFirst.\n\n00:00:13.500 --> 00:00:15.000\nNo identifier.\n\ncue-4\n01:00:00.250 --> 01:00:02.750 line:0\nLast one.\n`,
messy:`1\n00:00:01,00 --> 00:00:01,00\nZero duration.\n\nthis block has no timecode\nand should be skipped\n\n2\n00:00:05,5 --> 00:00:07,250\nHalf-second fraction.\n`};
function render(){
  const w=$('warnbox');
  if(parsed.warnings.length){
    w.innerHTML='<div class="warn">heads-up ('+parsed.warnings.length+'):<ul>'+parsed.warnings.map(x=>'<li>'+x.replace(/</g,'&lt;')+'</li>').join('')+'</ul></div>';
  }else w.innerHTML='';
  $('ops').style.display='block';
  $('preview').style.display='block';
  $('meta').innerHTML='format <b>'+parsed.format.toUpperCase()+'</b> · <b>'+parsed.cues.length+'</b> cues · overlaps <b>'+SubShift.overlapCount(parsed)+'</b>'+(parsed.skipped_blocks?' · '+parsed.skipped_blocks+' non-cue blocks skipped':'');
  $('rows').innerHTML=parsed.cues.map(c=>'<tr><td>'+c.index+'</td><td>'+SubShift.fromMs(c.start,parsed.format==='vtt')+'</td><td>'+SubShift.fromMs(c.end,parsed.format==='vtt')+'</td><td class="t">'+c.text.replace(/</g,'&lt;')+'</td></tr>').join('');
}
function loadText(t,name){
  fileName=(name||'subtitles').replace(/\.(srt|vtt)$/i,'');
  parsed=SubShift.parse(t);
  $('src').value=t;
  render();
}
$('open').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>loadText(String(r.result),f.name);
  r.readAsText(f);
};
$('src').addEventListener('input',()=>{if($('src').value.trim())loadText($('src').value);});
document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>loadText(PRESETS[b.dataset.p],b.dataset.p+'.srt'));
$('doshift').onclick=()=>{
  const ms=parseInt($('shiftms').value,10)||0;
  SubShift.shiftMs(parsed,ms);
  parsed.warnings=[];
  parsed=SubShift.parse(SubShift.convert(parsed,parsed.format));
  render();
};
$('dostretch').onclick=()=>{
  const r=parseFloat($('ratio').value);
  if(!r||r<=0)return;
  SubShift.stretch(parsed,r);
  parsed=SubShift.parse(SubShift.convert(parsed,parsed.format));
  render();
};
function dl(target){
  const out=SubShift.convert(parsed,target);
  const blob=new Blob([out],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=fileName+'.'+target;
  a.click();
  URL.revokeObjectURL(a.href);
}
$('dlsrt').onclick=()=>dl('srt');
$('dlvtt').onclick=()=>dl('vtt');
</script>
</body>
</html>
